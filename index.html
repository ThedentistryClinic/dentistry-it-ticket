<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบแจ้งซ่อม | Work Request</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --red:#c8102e; --red-d:#9d0c24; --ink:#1f2430; --mute:#6b7280; --line:#e5e7eb;
  --bg:#f5f6f8; --card:#fff; --ok:#15803d; --warn:#b45309; --blue:#1d4ed8;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Noto Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--red)}
.hide{display:none!important}

/* ---------- layout ---------- */
.topbar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar .in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{font-family:Georgia,'Times New Roman',serif;color:var(--red);font-size:22px;letter-spacing:.5px;font-weight:600;text-decoration:none}
.brand small{display:block;font-family:'Noto Sans Thai',sans-serif;font-size:11px;color:var(--mute);letter-spacing:0;font-weight:400;margin-top:-4px}
nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
nav a{padding:7px 14px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:500}
nav a:hover{background:#f1f2f4}
nav a.on{background:var(--red);color:#fff}
.me{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mute)}
.me b{color:var(--ink);font-weight:600}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;background:#eef0f3;color:#444}
.pill.it{background:#fde8ec;color:var(--red-d)}
main{max-width:1180px;margin:0 auto;padding:22px 16px 60px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:18px;margin:0 0 12px}
h3{font-size:16px;margin:0 0 12px}
.sub{color:var(--mute);margin:0 0 18px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 18px}
.grid.g3{grid-template-columns:repeat(3,1fr)}
.span2{grid-column:span 2}
@media(max-width:760px){.grid,.grid.g3{grid-template-columns:1fr}.span2{grid-column:auto}}

label.f{display:block;font-size:13px;font-weight:500;color:#374151}
label.f .req{color:var(--red)}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=datetime-local],select,textarea{
  width:100%;margin-top:4px;padding:9px 11px;border:1px solid #d1d5db;border-radius:8px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(200,16,46,.12)}
textarea{min-height:92px;resize:vertical}

.btn{border:1px solid #d1d5db;background:#fff;padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:500}
.btn:hover{background:#f3f4f6}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.pri:hover{background:var(--red-d)}
.btn.danger{color:#b91c1c;border-color:#fca5a5}
.btn.sm{padding:4px 11px;font-size:13px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.chks{display:flex;flex-wrap:wrap;gap:8px 22px}
label.chk{display:flex;gap:8px;align-items:center;cursor:pointer}
label.chk input{width:17px;height:17px;accent-color:var(--red)}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.seg{grid-template-columns:1fr}}
.seg label{border:2px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;display:flex;gap:12px;align-items:center;background:#fff}
.seg input{display:none}
.seg label:has(input:checked){border-color:var(--red);background:#fff5f6}
.seg .ico{font-size:26px}
.seg b{display:block}
.seg span.d{font-size:12.5px;color:var(--mute)}

/* ---------- table ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left}
.stat:hover{border-color:#cbd0d8}
.stat.on{border-color:var(--red);box-shadow:0 0 0 2px rgba(200,16,46,.12)}
.stat .n{font-size:26px;font-weight:700;line-height:1.1}
.stat .l{font-size:12.5px;color:var(--mute)}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.filters input,.filters select{margin:0;width:auto;min-width:160px}
.filters input[type=text]{flex:1;min-width:200px}
.tbl{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbl th{background:#fafafa;text-align:left;font-size:12.5px;color:var(--mute);padding:10px 12px;border-bottom:1px solid var(--line);font-weight:600}
.tbl td{padding:11px 12px;border-bottom:1px solid #f0f1f3;vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:#fafbfc}
.tno{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--mute);font-size:13px}
.empty{padding:40px;text-align:center;color:var(--mute);background:#fff;border:1px dashed #d1d5db;border-radius:12px}
.tablewrap{overflow-x:auto}

.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:600;white-space:nowrap}
.s-open{background:#e0e7ff;color:#3730a3}
.s-check{background:#fef3c7;color:#92400e}
.s-repair{background:#ffedd5;color:#9a3412}
.s-wait{background:#f3e8ff;color:#6b21a8}
.s-done{background:#dcfce7;color:#166534}
.s-cancel{background:#f3f4f6;color:#6b7280}
.c-medical{background:#fde8ec;color:#9d0c24}
.c-it{background:#dbeafe;color:#1e40af}
.c-building{background:#ccfbf1;color:#115e59}

/* ---------- dashboard ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .n{font-size:30px;font-weight:700;line-height:1.1}
.kpi .l{font-size:13px;color:var(--mute)}
.dgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media(max-width:860px){.dgrid{grid-template-columns:1fr}}
.dgrid .card{margin:0}
.hb{display:grid;grid-template-columns:140px 1fr 36px;gap:10px;align-items:center;padding:4px 0;border-radius:6px}
.hb.link{cursor:pointer}
.hb.link:hover{background:#f7f8fa}
.hb .hl{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .ht{background:#f1f2f4;height:12px;border-radius:99px;overflow:hidden}
.hb .hf{height:100%;border-radius:99px;min-width:2px}
.hb .hn{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.cols{display:flex;gap:10px;align-items:flex-end;height:170px;padding-top:6px}
.cols .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.cols .bar{width:100%;max-width:46px;background:var(--red);border-radius:6px 6px 0 0;min-height:2px}
.cols .v{font-size:12.5px;font-weight:600;margin-bottom:3px}
.cols .m{font-size:12px;color:var(--mute);margin-top:6px;white-space:nowrap}
.oldl{list-style:none;margin:0;padding:0}
.oldl li{display:flex;justify-content:space-between;gap:10px;padding:8px 6px;border-bottom:1px solid #f0f1f3;cursor:pointer;border-radius:6px}
.oldl li:last-child{border-bottom:0}
.oldl li:hover{background:#f7f8fa}

/* ---------- stepper ---------- */
.steps{display:flex;gap:0;margin:6px 0 4px}
.step{flex:1;text-align:center;position:relative;font-size:12.5px;color:var(--mute)}
.step::before{content:'';position:absolute;top:13px;left:-50%;width:100%;height:3px;background:#e5e7eb;z-index:0}
.step:first-child::before{display:none}
.step .dot{width:28px;height:28px;border-radius:50%;background:#e5e7eb;color:#fff;margin:0 auto 5px;display:flex;align-items:center;justify-content:center;font-weight:700;position:relative;z-index:1}
.step.done .dot,.step.cur .dot{background:var(--red)}
.step.done::before,.step.cur::before{background:var(--red)}
.step.cur{color:var(--ink);font-weight:600}
.cancelled-note{background:#f3f4f6;border-radius:8px;padding:10px 14px;color:#4b5563}

/* ---------- detail ---------- */
.kv{margin:0}
.kv dt{font-size:12.5px;color:var(--mute)}
.kv dd{margin:0 0 10px;white-space:pre-wrap;word-break:break-word}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{background:#f3f4f6;border-radius:6px;padding:2px 9px;font-size:13px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.gallery a{display:block;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.gallery img{width:100%;height:100%;object-fit:cover;display:block}
.tl{list-style:none;margin:0;padding:0}
.tl li{padding:0 0 14px 22px;position:relative;border-left:2px solid #e5e7eb;margin-left:6px}
.tl li::before{content:'';position:absolute;left:-7px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--red)}
.tl li:last-child{border-left-color:transparent;padding-bottom:0}
.itpanel{border-color:#f3b4be;background:#fffafb}

.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumb{position:relative;width:84px;height:84px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:2px;right:2px;border:0;background:rgba(0,0,0,.65);color:#fff;border-radius:50%;width:20px;height:20px;cursor:pointer;line-height:1}
.drop{border:2px dashed #cbd0d8;border-radius:10px;padding:16px;text-align:center;color:var(--mute);cursor:pointer;background:#fafafa}
.drop:hover{border-color:var(--red)}

/* ---------- auth ---------- */
.authwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.authbox{width:100%;max-width:430px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px 28px 24px;box-shadow:0 10px 40px rgba(0,0,0,.06)}
.authbox .brand{display:block;text-align:center;font-size:30px}
.authbox .brand small{font-size:12px}
.tabs{display:flex;background:#f1f2f4;border-radius:10px;padding:4px;margin:18px 0}
.tabs button{flex:1;border:0;background:transparent;padding:8px;border-radius:8px;cursor:pointer;font-weight:500}
.tabs button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.authbox form>*+*{margin-top:12px}
.err{background:#fef2f2;color:#b91c1c;border-radius:8px;padding:9px 12px;font-size:13.5px}
.note{background:#eff6ff;color:#1e40af;border-radius:8px;padding:9px 12px;font-size:13.5px}

#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1f2430;color:#fff;padding:10px 18px;border-radius:10px;z-index:100;opacity:0;pointer-events:none;transition:.25s;max-width:90vw}
#toast.show{opacity:1}
#toast.bad{background:#b91c1c}

/* ---------- print modal ---------- */
#printModal{position:fixed;inset:0;background:rgba(17,24,39,.6);z-index:60;overflow:auto;padding:18px 10px 40px}
#printModal .toolbar{max-width:794px;margin:0 auto 12px;display:flex;justify-content:space-between;gap:10px;align-items:center;color:#fff}
.sheet{width:794px;max-width:100%;min-height:1050px;margin:0 auto 18px;background:#fff;padding:36px 44px;box-shadow:0 4px 24px rgba(0,0,0,.25);font-size:13.5px;color:#000;line-height:1.45}
.sheet .logo{text-align:center;margin-bottom:10px}
.sheet .logo img{height:70px}
.sheet .logo .t{font-family:Georgia,'Times New Roman',serif;color:#c8102e;font-size:34px;letter-spacing:1px;line-height:1;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet .logo .s{font-family:Georgia,serif;color:#c8102e;font-size:8px;letter-spacing:.5px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet .ttl{text-align:center;font-weight:600;font-size:16px;margin:14px 0 12px}
.sheet .ttl small{display:block;font-weight:600;font-size:15px}
.sheet h4{margin:14px 0 6px;font-size:14px}
.fr{display:flex;gap:8px;align-items:baseline;margin:6px 0}
.fr.right{justify-content:flex-end}
.fr .u{flex:1;border-bottom:1px dotted #333;min-height:1.35em;padding:0 4px;white-space:pre-wrap;word-break:break-word}
.fr .u.fixed{flex:0 0 250px}
.fl{white-space:nowrap}
.lines{line-height:25px;min-height:78px;white-space:pre-wrap;word-break:break-word;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 24px,#555 24px,#555 25px);background-size:100% 25px;padding:0 4px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cbs{display:flex;flex-wrap:wrap;gap:6px 0;margin:6px 0}
.cbs .cb{width:33.33%;padding-right:6px}
.cb i{font-style:normal;font-size:16px}
.sign{display:flex;justify-content:space-between;gap:30px;margin-top:34px}
.sign>div{flex:1}
.sign .fr .u{flex:1}
.atts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.atts img{width:100%;max-height:330px;object-fit:contain;border:1px solid #bbb}

@page{size:A4;margin:11mm}
@media print{
  body{background:#fff}
  body>*:not(#printModal){display:none!important}
  #printModal{position:static!important;background:#fff!important;padding:0!important;overflow:visible!important}
  #printModal .toolbar{display:none!important}
  .sheet{box-shadow:none!important;margin:0!important;width:auto!important;min-height:0!important;padding:0!important;break-after:page}
  .sheet:last-child{break-after:auto}
}
</style>
</head>

<script>
/* =====================================================================
   ตั้งค่า  -  แก้ 2 บรรทัดนี้ (Supabase > Project Settings > API)
   ===================================================================== */
const CONFIG = {
  SUPABASE_URL: 'https://ylzrjkpfvfscveecpdzz.supabase.co',
  SUPABASE_ANON_KEY: 'sb_publishable_iPVu4picG0QWfv46fXK_yw_9c8KeQPm',
  LOGO_URL: '',                                  // ใส่ URL โลโก้ของคลินิก (ถ้ามี) เช่น 'logo.png'
  ORG_NAME: 'TANTATAT CLINIC COMPANY LIMITED',
  BUCKET: 'ticket-images'
};

/* ---------------- ค่าคงที่ ---------------- */
const STATUS = {
  open:          {label:'รับเรื่องแล้ว',        cls:'s-open'},
  checking:      {label:'กำลังตรวจสอบ',        cls:'s-check'},
  repairing:     {label:'ส่งซ่อม / กำลังซ่อม', cls:'s-repair'},
  waiting_parts: {label:'รออะไหล่',            cls:'s-wait'},
  done:          {label:'เสร็จสิ้น',            cls:'s-done'},
  cancelled:     {label:'ยกเลิก',               cls:'s-cancel'}
};
const STEPS = ['open','checking','repairing','waiting_parts','done'];
const ACTIVE = ['open','checking','repairing','waiting_parts'];
const STATUS_COLOR = {open:'#6366f1',checking:'#f59e0b',repairing:'#f97316',waiting_parts:'#a855f7',done:'#16a34a',cancelled:'#9ca3af'};
const CAT_COLOR = {medical:'#c8102e',it:'#2563eb',building:'#0f766e'};
const CATEGORY = {
  medical:{label:'อุปกรณ์การแพทย์', cls:'c-medical', ico:'🩺'},
  it:     {label:'อุปกรณ์ IT',       cls:'c-it',      ico:'💻'},
  building:{label:'อาคาร',            cls:'c-building', ico:'🏢'}
};
const CAUSES  = ['อายุการใช้งานของเครื่องมือ','การใช้งานต่อเนื่องเป็นเวลานาน','เครื่องมือเสื่อมสภาพ','การตกกระแทก','การทำความสะอาด / Sterile ไม่ถูกวิธี','การใช้งานผิดประเภท'];
const IMPACTS = ['ไม่มีผลกระทบต่อการรักษา','ต้องหยุดใช้งานเครื่องมือทันที','ต้องเลื่อน / เปลี่ยนแผนการรักษา'];
const IMPACT_DETAIL_LABEL = 'มีผลกระทบต่อการรักษา';
const ACTIONS = ['แจ้งหัวหน้างานแล้ว','แยกเครื่องมือออกจากการใช้งาน','ส่งตรวจสอบ / ซ่อม','เปลี่ยนใช้อุปกรณ์สำรอง'];
/* ----- งานอาคาร ----- */
const BUILDING_TYPES = [
  {label:'ระบบไฟฟ้า',            symptoms:['ไฟดับ','ไฟกระพริบ','ปลั๊กพ่วงไหม้','สวิตช์เสีย','ไฟช็อต']},
  {label:'ระบบแอร์ (ปรับอากาศ)', symptoms:['แอร์ไม่เย็น','แอร์น้ำหยด','แอร์มีเสียงดัง','แอร์ไม่ทำงาน','มีกลิ่นอับ']},
  {label:'ประตู',                 symptoms:['ประตูฝืด','กลอนประตูพัง','บานพับหลุด','ประตูกระจกแตก','คีย์การ์ดเปิดไม่ได้']},
  {label:'ผนัง / ตัวอาคาร',       symptoms:['ผนังร้าว','สีลอกร่อน','น้ำรั่วซึมจากเพดาน','ฝ้าเพดานทะลุ','กระเบื้องพื้นแตก']}
];
const B_IMPACTS = ['ไม่มีผลกระทบต่อการใช้งาน','ใช้งานพื้นที่ได้บางส่วน','ต้องปิดห้อง / พื้นที่ชั่วคราว','เสี่ยงต่อความปลอดภัย'];
const B_ACTIONS = ['แจ้งหัวหน้างานแล้ว','กั้นพื้นที่ / ติดป้ายห้ามใช้งาน','ปิดสวิตช์ / ตัดระบบที่เกี่ยวข้อง','ย้ายไปใช้พื้นที่อื่นชั่วคราว'];

/* ---------------- helpers ---------------- */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = d => d ? new Date(d).toLocaleDateString('th-TH',{day:'2-digit',month:'2-digit',year:'numeric'}) : '';
const fmtDT   = d => d ? new Date(d).toLocaleString('th-TH',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
const today   = () => { const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
let toastT;
function toast(msg,bad){ const t=$('#toast'); t.textContent=msg; t.className='show'+(bad?' bad':''); clearTimeout(toastT); toastT=setTimeout(()=>t.className='',3200); }
const errMsg = e => (e && (e.message||e.error_description)) || 'เกิดข้อผิดพลาด';
const badge = s => `<span class="badge ${STATUS[s]?.cls||''}">${esc(STATUS[s]?.label||s)}</span>`;
const catBadge = c => `<span class="badge ${CATEGORY[c]?.cls||''}">${esc(CATEGORY[c]?.label||c)}</span>`;

const configured = !CONFIG.SUPABASE_URL.includes('YOUR-') && !CONFIG.SUPABASE_ANON_KEY.includes('YOUR-');
let sb, me = null, isIT = false;

/* =====================================================================
   BOOT / AUTH
   ===================================================================== */
async function boot(){
  if(!configured){
    $('#app').innerHTML = `<div class="authwrap"><div class="authbox">
      <span class="brand">TANTATAT<small>ระบบแจ้งซ่อม</small></span>
      <div class="err" style="margin-top:18px">ยังไม่ได้ตั้งค่า Supabase<br>เปิดไฟล์ <b>index.html</b> แล้วแก้ <code>SUPABASE_URL</code> และ <code>SUPABASE_ANON_KEY</code> ที่ส่วน CONFIG ด้านบนของ script</div></div></div>`;
    return;
  }
  sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  const {data:{session}} = await sb.auth.getSession();
  if(session) await enter(session.user); else showAuth();
  sb.auth.onAuthStateChange(ev=>{ if(ev==='SIGNED_OUT' && me){ me=null; isIT=false; showAuth(); } });
}

function showAuth(mode='login', msg=''){
  const reg = mode==='register';
  $('#app').innerHTML = `
  <div class="authwrap"><div class="authbox">
    <span class="brand">TANTATAT<small>ระบบแจ้งซ่อมและรายงานเครื่องมือชำรุด</small></span>
    <div class="tabs">
      <button data-m="login" class="${reg?'':'on'}">เข้าสู่ระบบ</button>
      <button data-m="register" class="${reg?'on':''}">สมัครใช้งาน</button>
    </div>
    <form id="authForm" autocomplete="on">
      ${msg?`<div class="${msg.startsWith('!')?'err':'note'}">${esc(msg.replace(/^!/,''))}</div>`:''}
      ${reg?`
        <label class="f">ชื่อ-นามสกุล <span class="req">*</span><input type="text" name="full_name" required></label>
        <div class="grid"><label class="f">ตำแหน่ง<input type="text" name="position"></label>
        <label class="f">สาขา<input type="text" name="branch"></label></div>`:''}
      <label class="f">อีเมล <span class="req">*</span><input type="email" name="email" required autocomplete="username"></label>
      <label class="f">รหัสผ่าน <span class="req">*</span><input type="password" name="password" required minlength="6" autocomplete="${reg?'new-password':'current-password'}"></label>
      <button class="btn pri" style="width:100%" id="authBtn">${reg?'สมัครใช้งาน':'เข้าสู่ระบบ'}</button>
    </form>
  </div></div>`;
  $$('.tabs button').forEach(b=>b.onclick=()=>showAuth(b.dataset.m));
  $('#authForm').onsubmit = async ev=>{
    ev.preventDefault();
    const f = Object.fromEntries(new FormData(ev.target));
    const btn = $('#authBtn'); btn.disabled = true;
    try{
      if(reg){
        const {data,error} = await sb.auth.signUp({email:f.email.trim(),password:f.password,options:{data:{full_name:f.full_name.trim(),position:f.position?.trim()||'',branch:f.branch?.trim()||''}}});
        if(error) throw error;
        if(data.session) await enter(data.user);
        else showAuth('login','สมัครสำเร็จ กรุณายืนยันอีเมล (ถ้าระบบเปิดการยืนยัน) แล้วเข้าสู่ระบบ');
      }else{
        const {data,error} = await sb.auth.signInWithPassword({email:f.email.trim(),password:f.password});
        if(error) throw error;
        await enter(data.user);
      }
    }catch(e){
      showAuth(mode,'!'+(e.message==='Invalid login credentials'?'อีเมลหรือรหัสผ่านไม่ถูกต้อง':errMsg(e)));
    }
  };
}

async function enter(user){
  const {data,error} = await sb.from('profiles').select('*').eq('id',user.id).single();
  if(error || !data){ await sb.auth.signOut(); me=null; showAuth('login','!ไม่พบข้อมูลผู้ใช้ กรุณารัน supabase_setup.sql ให้ครบ'); return; }
  if(!data.active){ await sb.auth.signOut(); me=null; showAuth('login','!บัญชีนี้ถูกปิดการใช้งาน กรุณาติดต่อ IT'); return; }
  me = data; isIT = data.role==='it';
  renderShell();
  route();
}

window.addEventListener('hashchange',()=>{ if(me) route(); });
function route(){
  const h = location.hash || (isIT ? '#/dashboard' : '#/list');
  const parts = h.replace(/^#\//,'').split('/');
  const name = parts[0];
  $$('#nav a').forEach(a=>a.classList.toggle('on', a.dataset.r===(name==='t'?'list':name)));
  window.scrollTo(0,0);
  if(name==='new') return viewNew();
  if(name==='t' && parts[1]) return viewDetail(parts[1]);
  if(name==='dashboard' && isIT) return viewDashboard();
  if(name==='users' && isIT) return viewUsers();
  return viewList();
}

/* =====================================================================
   EXPORT EXCEL  (ผู้ใช้ทั่วไปได้เฉพาะของตัวเอง / IT ได้ทั้งหมดตามที่เห็น)
   ===================================================================== */
async function exportExcel(ids){
  if(typeof XLSX==='undefined') return toast('โหลดตัวช่วยสร้างไฟล์ Excel ไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่',true);
  const {data,error} = await sb.from('tickets').select('*').order('created_at',{ascending:false});
  if(error) return toast(errMsg(error),true);
  const set = ids ? new Set(ids) : null;
  const list = (data||[]).filter(t=>(!set||set.has(t.id)) && (isIT || t.created_by===me.id));
  if(!list.length) return toast('ไม่มีรายการให้ส่งออก',true);
  const j = a => (a||[]).join(', ');
  const rows = list.map(t=>({
    'เลขที่ Ticket': t.ticket_no,
    'ประเภท': CATEGORY[t.category]?.label||t.category,
    'สถานะ': STATUS[t.status]?.label||t.status,
    'วันที่แจ้ง': fmtDate(t.created_at),
    'ผู้แจ้ง': t.reporter_name||'',
    'ตำแหน่ง': t.reporter_position||'',
    'สาขา': t.branch||'',
    'ชื่อเครื่องมือ / รายการ': t.equipment_name||'',
    'ยี่ห้อ / รุ่น': t.brand_model||'',
    'Serial No.': t.serial_no||'',
    'สถานที่': t.location||'',
    'วันที่ / เวลาเกิดเหตุ': fmtDT(t.incident_at),
    'ประเภทงานซ่อม (อาคาร)': t.repair_type||'',
    'อาการที่พบ (อาคาร)': [j(t.symptoms), t.symptom_other].filter(Boolean).join(', '),
    'ปัญหาที่พบ / รายละเอียด': t.problem||'',
    'สาเหตุที่คาดว่าชำรุด': [j(t.causes), t.cause_other].filter(Boolean).join(', '),
    'ผลกระทบ': [j(t.impacts), t.impact_detail, t.impact_other].filter(Boolean).join(', '),
    'การดำเนินการเบื้องต้น': [j(t.actions), t.action_other].filter(Boolean).join(', '),
    'ผู้ดูแล (IT)': t.handled_by_name||'',
    'ความคิดเห็นผู้จัดการ': t.manager_opinion||'',
    'จำนวนรูปแนบ': (t.images||[]).length,
    'อัปเดตล่าสุด': fmtDT(t.updated_at)
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = Object.keys(rows[0]).map(k=>({wch: Math.min(48, Math.max(12, k.length+2, ...rows.map(r=>String(r[k]??'').length+2)))}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'ใบแจ้งซ่อม');
  XLSX.writeFile(wb, `repair-requests-${today()}.xlsx`);
  toast(`ส่งออก ${rows.length} รายการแล้ว`);
}

let dashPeriod = 'all';
async function viewDashboard(){
  const m = $('#main');
  m.innerHTML = '<p class="muted">กำลังโหลด...</p>';
  const {data,error} = await sb.from('tickets').select('id,ticket_no,category,status,equipment_name,reporter_name,branch,created_at,updated_at').order('created_at',{ascending:false});
  if(error){ m.innerHTML=`<div class="err">${esc(errMsg(error))}</div>`; return; }
  const all = data||[];
  const DAY = 86400000, now = Date.now();

  const inPeriod = t=>{
    const age = now - new Date(t.created_at).getTime();
    if(dashPeriod==='30') return age <= 30*DAY;
    if(dashPeriod==='90') return age <= 90*DAY;
    if(dashPeriod==='year') return new Date(t.created_at).getFullYear() === new Date().getFullYear();
    return true;
  };
  const bars = (rows,attr)=>{
    const max = Math.max(1,...rows.map(r=>r.n));
    return rows.map(r=>`<div class="hb ${attr?'link':''}" ${attr?`data-${attr}="${esc(r.key)}"`:''} title="${esc(r.label)}: ${r.n}">
      <div class="hl">${esc(r.label)}</div><div class="ht"><div class="hf" style="width:${r.n/max*100}%;background:${r.color}"></div></div><div class="hn">${r.n}</div></div>`).join('') || '<p class="muted" style="margin:0">ไม่มีข้อมูล</p>';
  };

  const draw = ()=>{
    const d = all.filter(inPeriod);
    const active = d.filter(t=>ACTIVE.includes(t.status)).length;
    const done = d.filter(t=>t.status==='done');
    const monthStart = new Date(new Date().getFullYear(), new Date().getMonth(), 1).getTime();
    const thisMonth = all.filter(t=>new Date(t.created_at).getTime() >= monthStart).length;
    const avg = done.length ? done.reduce((a,t)=>a+(new Date(t.updated_at)-new Date(t.created_at)),0)/done.length/DAY : null;

    const byStatus = Object.keys(STATUS).map(k=>({key:k,label:STATUS[k].label,n:d.filter(t=>t.status===k).length,color:STATUS_COLOR[k]}));
    const byCat = Object.keys(CATEGORY).map(k=>({key:k,label:CATEGORY[k].label,n:d.filter(t=>t.category===k).length,color:CAT_COLOR[k]}));
    const bm = {};
    d.forEach(t=>{ const b=(t.branch||'').trim()||'(ไม่ระบุสาขา)'; bm[b]=(bm[b]||0)+1; });
    const byBranch = Object.entries(bm).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([k,n])=>({key:k,label:k,n,color:'#475569'}));

    const months = [];
    for(let i=5;i>=0;i--){ const dt = new Date(new Date().getFullYear(), new Date().getMonth()-i, 1); months.push({y:dt.getFullYear(),m:dt.getMonth(),label:dt.toLocaleDateString('th-TH',{month:'short',year:'2-digit'}),n:0}); }
    all.forEach(t=>{ const c=new Date(t.created_at); const x=months.find(o=>o.y===c.getFullYear()&&o.m===c.getMonth()); if(x) x.n++; });
    const mmax = Math.max(1,...months.map(x=>x.n));

    const oldest = all.filter(t=>ACTIVE.includes(t.status)).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)).slice(0,6);

    $('#dash').innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="n">${d.length}</div><div class="l">คำขอทั้งหมด${dashPeriod==='all'?'':' (ตามช่วงเวลา)'}</div></div>
      <div class="kpi"><div class="n" style="color:#b45309">${active}</div><div class="l">กำลังดำเนินการ / ค้างอยู่</div></div>
      <div class="kpi"><div class="n" style="color:#15803d">${done.length}</div><div class="l">เสร็จสิ้นแล้ว</div></div>
      <div class="kpi"><div class="n">${thisMonth}</div><div class="l">แจ้งใหม่เดือนนี้</div></div>
      <div class="kpi"><div class="n">${avg===null?'-':avg.toFixed(1)}<span style="font-size:14px;font-weight:500"> ${avg===null?'':'วัน'}</span></div><div class="l">เวลาเฉลี่ยจนเสร็จ (โดยประมาณ)</div></div>
    </div>
    <div class="dgrid">
      <div class="card"><h3>แยกตามสถานะ <span class="muted">(คลิกเพื่อดูรายการ)</span></h3>${bars(byStatus,'s')}</div>
      <div class="card"><h3>แยกตามประเภท <span class="muted">(คลิกเพื่อดูรายการ)</span></h3>${bars(byCat,'c')}</div>
      <div class="card"><h3>คำขอใหม่ 6 เดือนล่าสุด</h3>
        <div class="cols">${months.map(x=>`<div class="col"><div class="v">${x.n}</div><div class="bar" style="height:${x.n/mmax*100}%"></div><div class="m">${esc(x.label)}</div></div>`).join('')}</div></div>
      <div class="card"><h3>แยกตามสาขา (สูงสุด 8 อันดับ)</h3>${bars(byBranch)}</div>
      <div class="card" style="grid-column:1/-1"><h3>งานค้างที่เก่าที่สุด</h3>
        ${oldest.length ? `<ul class="oldl">${oldest.map(t=>`<li data-id="${t.id}"><span><b class="tno">${esc(t.ticket_no)}</b> ${catBadge(t.category)} ${esc(t.equipment_name)}<span class="muted"> · ${esc(t.reporter_name)}${t.branch?' / '+esc(t.branch):''}</span></span><span style="white-space:nowrap">${badge(t.status)} <span class="muted">ค้าง ${Math.max(0,Math.floor((now-new Date(t.created_at))/DAY))} วัน</span></span></li>`).join('')}</ul>` : '<p class="muted" style="margin:0">ไม่มีงานค้าง 🎉</p>'}
      </div>
    </div>`;
    $$('#dash .hb[data-s]').forEach(el=>el.onclick=()=>{ listState = {q:'',status:el.dataset.s,cat:''}; location.hash='#/list'; });
    $$('#dash .hb[data-c]').forEach(el=>el.onclick=()=>{ listState = {q:'',status:'',cat:el.dataset.c}; location.hash='#/list'; });
    $$('#dash .oldl li').forEach(el=>el.onclick=()=>location.hash='#/t/'+el.dataset.id);
  };

  m.innerHTML = `
  <div class="head"><div><h1>Dashboard</h1><p class="sub" style="margin:0">ภาพรวมงานแจ้งซ่อมทั้งระบบ</p></div>
    <div class="actions">
      <select id="dp" style="margin:0;width:auto"><option value="all">ทั้งหมด</option><option value="30">30 วันล่าสุด</option><option value="90">90 วันล่าสุด</option><option value="year">ปีนี้</option></select>
      <button class="btn" id="dExport">⬇ Export Excel (ทั้งหมด)</button>
    </div></div>
  <div id="dash"></div>`;
  $('#dp').value = dashPeriod;
  $('#dp').onchange = e=>{ dashPeriod = e.target.value; draw(); };
  $('#dExport').onclick = ()=>exportExcel(null);
  draw();
}

function drawThumbs(){
  $('#thumbs').innerHTML = pending.map((p,i)=>`<div class="thumb"><img src="${p.url}"><button type="button" data-i="${i}" title="ลบ">×</button></div>`).join('');
  $$('#thumbs button').forEach(b=>b.onclick=()=>{ pending.splice(+b.dataset.i,1); drawThumbs(); });
}
async function compress(file,max=1600,q=.82){
  try{
    const bmp = await createImageBitmap(file);
    const sc = Math.min(1,max/Math.max(bmp.width,bmp.height));
    const c = document.createElement('canvas'); c.width=Math.round(bmp.width*sc); c.height=Math.round(bmp.height*sc);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',q));
  }catch{ return file; }
}

async function submitTicket(ev){
  ev.preventDefault();
  const form = ev.target, fd = new FormData(form), v = n=>(fd.get(n)||'').toString().trim();
  const many = n=>$$(`input[name=${n}]:checked:not(:disabled)`,form).map(i=>i.value);
  const btn = $('#submitBtn'); btn.disabled=true; btn.textContent='กำลังบันทึก...';
  const id = crypto.randomUUID();
  const row = {
    id, created_by: me.id, category: v('category'),
    reporter_name:v('reporter_name'), reporter_position:v('reporter_position'), branch:v('branch'),
    report_date: v('report_date')||today(),
    equipment_name: v('category')==='building' ? v('repair_type') : v('equipment_name'),
    brand_model:v('brand_model'), serial_no:v('serial_no'), age_estimate:v('age_estimate'),
    repair_type:v('repair_type')||null, symptoms:many('symptoms'), symptom_other:v('symptom_other'),
    incident_at: v('incident_at') ? new Date(v('incident_at')).toISOString() : null,
    location:v('location'), problem:v('problem'),
    causes:many('causes'), cause_other:v('cause_other'), details:v('details'),
    impacts:many('impacts'), impact_detail:v('impact_detail'), impact_other:v('impact_other'),
    actions:many('actions'), action_other:v('action_other')
  };
  try{
    const {data,error} = await sb.from('tickets').insert(row).select('id,ticket_no').single();
    if(error) throw error;
    const paths = [];
    for(let i=0;i<pending.length;i++){
      const ext = pending[i].blob.type==='image/jpeg' ? 'jpg' : (pending[i].blob.type.split('/')[1]||'jpg');
      const path = `${me.id}/${id}/${Date.now()}-${i}.${ext}`;
      const {error:ue} = await sb.storage.from(CONFIG.BUCKET).upload(path,pending[i].blob,{contentType:pending[i].blob.type||'image/jpeg'});
      if(ue){ toast('อัปโหลดรูปที่ '+(i+1)+' ไม่สำเร็จ: '+errMsg(ue),true); continue; }
      paths.push(path);
    }
    if(paths.length) await sb.from('tickets').update({images:paths}).eq('id',id);
    await sb.from('ticket_logs').insert({ticket_id:id,status:'open',note:'สร้างใบแจ้งซ่อม',by_name:me.full_name});
    toast('สร้างใบแจ้งซ่อมแล้ว: '+data.ticket_no);
    location.hash = '#/t/'+id;
  }catch(e){
    toast(errMsg(e),true); btn.disabled=false; btn.textContent='ส่งใบแจ้งซ่อม';
  }
}

async function signedUrls(paths){
  if(!paths?.length) return [];
  const {data} = await sb.storage.from(CONFIG.BUCKET).createSignedUrls(paths,3600);
  return (data||[]).map(d=>d.signedUrl).filter(Boolean);
}

    <form id="uf"><div class="grid g3">
      <label class="f">ชื่อ-นามสกุล <span class="req">*</span><input type="text" name="full_name" required></label>
      <label class="f">อีเมล <span class="req">*</span><input type="email" name="email" required></label>
      <label class="f">รหัสผ่านเริ่มต้น <span class="req">*</span><input type="text" name="password" required minlength="6"></label>
      <label class="f">ตำแหน่ง<input type="text" name="position"></label>
      <label class="f">สาขา<input type="text" name="branch"></label>
      <label class="f">สิทธิ์ <span class="req">*</span><select name="role"><option value="user">User (ผู้แจ้งซ่อม)</option><option value="it">IT (ผู้ดูแล)</option></select></label>
    </div><div style="margin-top:12px"><button class="btn pri" id="ubtn">สร้างผู้ใช้</button></div></form></div>
  <div class="tablewrap"><table class="tbl"><thead><tr><th>ชื่อ</th><th>อีเมล</th><th>ตำแหน่ง / สาขา</th><th>สิทธิ์</th><th>สถานะ</th></tr></thead><tbody>
    ${data.map(u=>{ const self=u.id===me.id; return `<tr style="cursor:default"><td><b>${esc(u.full_name)}</b>${self?' <span class="muted">(คุณ)</span>':''}</td><td>${esc(u.email)}</td>
      <td>${esc(u.position)}<div class="muted">${esc(u.branch)}</div></td>
      <td><select data-role="${u.id}" ${self?'disabled':''} style="margin:0;width:auto"><option value="user" ${u.role==='user'?'selected':''}>User</option><option value="it" ${u.role==='it'?'selected':''}>IT</option></select></td>
      <td><label class="chk"><input type="checkbox" data-act="${u.id}" ${u.active?'checked':''} ${self?'disabled':''}> ใช้งานได้</label></td></tr>`;}).join('')}
  </tbody></table></div>`;

  $$('select[data-role]').forEach(s=>s.onchange=async()=>{
    const {error} = await sb.from('profiles').update({role:s.value}).eq('id',s.dataset.role);
    toast(error?errMsg(error):'เปลี่ยนสิทธิ์แล้ว',!!error);
  });
  $$('input[data-act]').forEach(c=>c.onchange=async()=>{
    const {error} = await sb.from('profiles').update({active:c.checked}).eq('id',c.dataset.act);
    toast(error?errMsg(error):(c.checked?'เปิดการใช้งานแล้ว':'ปิดการใช้งานแล้ว'),!!error);
  });
  $('#uf').onsubmit = async ev=>{
    ev.preventDefault();
    const f = Object.fromEntries(new FormData(ev.target));
    const btn = $('#ubtn'); btn.disabled = true;
    try{
      // ใช้ client ชั่วคราว เพื่อไม่ให้ session ของ IT หลุด
      const tmp = supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,storageKey:'tmp-create-user'}});
      const {data:r,error} = await tmp.auth.signUp({email:f.email.trim(),password:f.password,options:{data:{full_name:f.full_name.trim(),position:f.position.trim(),branch:f.branch.trim()}}});
      if(error) throw error;
      if(!r.user || (r.user.identities && r.user.identities.length===0)) throw new Error('อีเมลนี้มีผู้ใช้งานแล้ว');
      if(f.role==='it'){
        const {error:pe} = await sb.from('profiles').update({role:'it'}).eq('id',r.user.id);
        if(pe) throw pe;
      }
      toast('สร้างผู้ใช้แล้ว: '+f.email);
      viewUsers();
    }catch(e){ toast(errMsg(e),true); btn.disabled=false; }
  };
}

/* =====================================================================
   PRINT  -  ใบแจ้งซ่อมและรายงานเครื่องมือชำรุด (Work Request Form)
   ===================================================================== */
const U  = (v,cls='') => `<span class="u ${cls}">${esc(v)||'&nbsp;'}</span>`;
const CB = (on,label) => `<span class="cb"><i>${on?'☑':'☐'}</i> ${esc(label)}</span>`;
const LN = v => `<div class="lines">${esc(v)}</div>`;
const logoHtml = () => CONFIG.LOGO_URL
  ? `<div class="logo"><img src="${esc(CONFIG.LOGO_URL)}" alt=""></div>`
  : `<div class="logo"><div class="t">TANTATAT</div><div class="s">${esc(CONFIG.ORG_NAME)}</div></div>`;

function formHtml(t,imgs){
  const has = (arr,x)=>(arr||[]).includes(x);
  const isB = t.category==='building', isM = t.category==='medical';
  let n = 0; const H = x => `<h4>${++n}. ${x}</h4>`;
  const p1 = [], p2 = [];
  if(isB){
    const bt = BUILDING_TYPES.find(b=>b.label===t.repair_type);
    p1.push(`${H('สถานที่และประเภทงานซ่อม')}
      <div class="fr"><span class="fl">สถานที่เกิดเหตุ (ชื่อห้อง):</span>${U(t.location)}<span class="fl">วันที่ / เวลาที่พบ:</span>${U(fmtDT(t.incident_at))}</div>
      <div class="fr"><span class="fl">ประเภทงานซ่อม:</span></div>
      <div class="cbs">${BUILDING_TYPES.map(b=>CB(t.repair_type===b.label,b.label)).join('')}</div>
      <div class="fr"><span class="fl">อาการที่พบ:</span></div>
      <div class="cbs">${(bt?bt.symptoms:[]).map(x=>CB(has(t.symptoms,x),x)).join('')}</div>
      <div class="fr"><span class="cb"><i>${t.symptom_other?'☑':'☐'}</i> อื่นๆ โปรดระบุ</span>${U(t.symptom_other)}</div>`);
    p1.push(`${H('รายละเอียดอาการ (พร้อมแนบรูป)')}${LN(t.problem)}`);
    p2.push(`${H('ผลกระทบ')}
      <div class="cbs">${B_IMPACTS.map(c=>`<span class="cb" style="width:50%"><i>${has(t.impacts,c)?'☑':'☐'}</i> ${esc(c)}</span>`).join('')}</div>
      <div class="fr"><span class="cb"><i>${t.impact_other?'☑':'☐'}</i> อื่นๆ</span>${U(t.impact_other)}</div>`);
    p2.push(`${H('การดำเนินงานเบื้องต้น')}
      <div class="cbs">${B_ACTIONS.map(c=>`<span class="cb" style="width:50%"><i>${has(t.actions,c)?'☑':'☐'}</i> ${esc(c)}</span>`).join('')}</div>
      <div class="fr"><span class="cb"><i>${t.action_other?'☑':'☐'}</i> อื่นๆ</span>${U(t.action_other)}</div>`);
  }else{
    p1.push(`${H('รายละเอียดเครื่องมือ')}
      <div class="fr"><span class="fl">ชื่อเครื่องมือ:</span>${U(t.equipment_name)}<span class="fl">ยี่ห้อ / รุ่น:</span>${U(t.brand_model)}</div>
      <div class="fr"><span class="fl">รหัสเครื่องมือ / Serial No.:</span>${U(t.serial_no)}<span class="fl">อายุการใช้งานโดยประมาณ:</span>${U(t.age_estimate)}</div>`);
    p1.push(`${H('รายละเอียดปัญหาที่พบ')}
      <div class="fr"><span class="fl">วันที่ / เวลาที่เกิดเหตุ:</span>${U(fmtDT(t.incident_at))}<span class="fl">สถานที่ใช้งาน:</span>${U(t.location)}</div>
      <div class="fr"><span class="fl">ลักษณะปัญหา / ความเสียหายที่พบ (พร้อมแนบรูปอุปกรณ์ที่ชำรุด) :</span></div>
      ${LN(t.problem)}`);
    p1.push(`${H('สาเหตุที่คาดว่าเครื่องมือชำรุด')}
      <div class="cbs">${CAUSES.map(c=>CB(has(t.causes,c),c)).join('')}</div>
      <div class="fr"><span class="cb"><i>${t.cause_other?'☑':'☐'}</i> อื่นๆ โปรดระบุ</span>${U(t.cause_other)}</div>
      <div class="fr"><b class="fl">รายละเอียดเพิ่มเติม :</b>${U('')}</div>
      ${LN(t.details)}`);
    if(isM) p2.push(`${H('ผลกระทบที่เกิดขึ้น')}
      <div class="cbs">${IMPACTS.map(c=>CB(has(t.impacts,c),c)).join('')}</div>
      <div class="fr"><span class="cb"><i>${has(t.impacts,IMPACT_DETAIL_LABEL)?'☑':'☐'}</i> มีผลกระทบต่อการรักษา โปรดระบุ:</span>${U(t.impact_detail)}</div>
      <div class="fr"><span class="cb"><i>${t.impact_other?'☑':'☐'}</i> อื่นๆ</span>${U(t.impact_other)}</div>`);
    p2.push(`${H('การดำเนินการเบื้องต้น')}
      <div class="cbs">${ACTIONS.map(c=>`<span class="cb" style="width:50%"><i>${has(t.actions,c)?'☑':'☐'}</i> ${esc(c)}</span>`).join('')}</div>
      <div class="fr"><span class="cb"><i>${t.action_other?'☑':'☐'}</i> อื่นๆ</span>${U(t.action_other)}</div>`);
  }
  p2.push(`${H('ความคิดเห็นผู้จัดการสาขา')}
    ${LN(t.manager_opinion)}
    <div class="fr" style="margin-top:12px"><span class="fl">ข้อเสนอแนะ / แนวทางป้องกันเพิ่มเติม</span></div>
    ${LN(t.recommendation)}`);

  const page1 = `<section class="sheet">
    ${logoHtml()}
    <div class="ttl">ใบแจ้งซ่อมและรายงาน${isB?'งานซ่อมอาคาร':'เครื่องมือชำรุด'}<small>(Work Request Form)</small></div>
    <div class="fr right"><span class="fl">เลขที่เอกสาร:</span>${U(t.ticket_no,'fixed')}</div>
    <div class="fr right"><span class="fl">วันที่แจ้งปัญหา:</span>${U(fmtDate(t.report_date),'fixed')}</div>
    <div class="fr right"><span class="fl">ประเภท:</span>${U(CATEGORY[t.category]?.label,'fixed')}</div>
    <div class="fr"><span class="fl">ชื่อผู้แจ้ง:</span>${U(t.reporter_name)}<span class="fl">ตำแหน่ง:</span>${U(t.reporter_position)}<span class="fl">สาขา:</span>${U(t.branch)}</div>
    ${p1.join('')}
  </section>`;

  const page2 = `<section class="sheet">
    ${logoHtml()}
    ${p2.join('')}
    <div class="sign">
      <div><div class="fr"><span class="fl">ลงชื่อผู้แจ้ง</span>${U('')}</div>
        <div class="fr"><span class="fl">(</span>${U(t.reporter_name).replace('class="u "','class="u" style="text-align:center;border:0"')}<span class="fl">)</span></div>
        <div class="fr"><span class="fl">วันที่</span>${U(fmtDate(t.report_date))}</div></div>
      <div><div class="fr"><span class="fl">ลงชื่อผู้จัดการสาขา</span>${U('')}</div>
        <div class="fr"><span class="fl">(</span>${U('').replace('class="u "','class="u" style="border:0"')}<span class="fl">)</span></div>
        <div class="fr"><span class="fl">วันที่</span>${U('')}</div></div>
    </div>
  </section>`;

  const page3 = imgs.length ? `<section class="sheet">${logoHtml()}
    <h4>รูปแนบ — ${esc(t.ticket_no)} · ${esc(t.equipment_name)}</h4>
    <div class="atts">${imgs.map(u=>`<img src="${u}" alt="">`).join('')}</div></section>` : '';
  return page1+page2+page3;
}

function openPrint(t,imgs){
  $('#printModal')?.remove();
  const el = document.createElement('div');
  el.id = 'printModal';
  el.innerHTML = `<div class="toolbar"><b>ตัวอย่างก่อนพิมพ์ — ${esc(t.ticket_no)}</b>
    <div class="actions"><button class="btn pri" id="doPrint">🖨 พิมพ์ / บันทึกเป็น PDF</button><button class="btn" id="closePrint">ปิด</button></div></div>${formHtml(t,imgs)}`;
  document.body.appendChild(el);
  $('#doPrint').onclick = ()=>window.print();
  $('#closePrint').onclick = ()=>el.remove();
}

boot();
</script>
</body>
